# foundry.toml — Canonical Avalanche Configuration
# Drop this at project root. Every Avalanche Foundry project uses this.

[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# ── CRITICAL: Avalanche requires Cancun EVM ──────────────────────────────────
# Solidity ≥0.8.30 defaults to Pectra which Avalanche does NOT support.
# Never remove or change this line.
evm_version = "cancun"

# ── Compiler ─────────────────────────────────────────────────────────────────
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false                 # set true only for large contracts hitting stack limit

# ── Testing ──────────────────────────────────────────────────────────────────
[profile.default.fuzz]
runs = 10000                   # 10k minimum for production contracts
max_test_rejects = 65536
seed = "0x1234"                # deterministic seed for CI reproducibility

[profile.default.invariant]
runs = 500
depth = 100
fail_on_revert = false

# ── RPC Endpoints ─────────────────────────────────────────────────────────────
[rpc_endpoints]
fuji      = "${FUJI_RPC_URL}"
avalanche = "${AVAX_RPC_URL}"
local     = "http://127.0.0.1:9650/ext/bc/C/rpc"

# ── Block Explorers ───────────────────────────────────────────────────────────
[etherscan]
fuji = { key = "${SNOWTRACE_API_KEY}", url = "https://api-testnet.snowtrace.io/api" }
avalanche = { key = "${SNOWTRACE_API_KEY}", url = "https://api.snowtrace.io/api" }

# ── Formatting ────────────────────────────────────────────────────────────────
[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "all"
quote_style = "double"
number_underscore = "thousands"

# ── CI Profile (stricter) ─────────────────────────────────────────────────────
[profile.ci]
fuzz = { runs = 100000 }
invariant = { runs = 1000, depth = 200 }
